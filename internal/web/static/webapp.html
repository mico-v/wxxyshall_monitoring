<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿舍电费监控</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink-1:       #0b0b0b;
    --ink-2:       #52514e;
    --ink-3:       #898781;
    --grid:        #e1e0d9;
    --axis:        #c3c2b7;
    --series-1:    #2a78d6;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --border:      rgba(11, 11, 11, 0.10);
    --shadow:      0 1px 2px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --ink-1:       #ffffff;
      --ink-2:       #c3c2b7;
      --ink-3:       #898781;
      --grid:        #2c2c2a;
      --axis:        #383835;
      --series-1:    #3987e5;
      --border:      rgba(255, 255, 255, 0.10);
      --shadow:      0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink-1:       #ffffff;
    --ink-2:       #c3c2b7;
    --ink-3:       #898781;
    --grid:        #2c2c2a;
    --axis:        #383835;
    --series-1:    #3987e5;
    --border:      rgba(255, 255, 255, 0.10);
    --shadow:      0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; min-width: 0; }
  @media (max-width: 480px) { .wrap { padding: 16px 12px 36px; } }

  /* ---- 头部 ---- */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 650; margin: 0; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .theme-btn {
    font: inherit; font-size: 13px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink-1); }

  /* ---- KPI 行 ---- */
  .kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    min-width: 0; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .label { font-size: 12px; color: var(--ink-2); }
  .kpi .value {
    min-width: 0; overflow-wrap: anywhere;
    font-size: 28px; font-weight: 650; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .kpi .value.hero { font-size: 40px; }
  .kpi .delta { font-size: 12px; margin-top: 2px; }
  .up   { color: var(--good); }
  .down { color: var(--critical); }
  .flat { color: var(--ink-3); }

  /* ---- 状态徽标 ---- */
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 5px 11px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    margin-top: 8px;
  }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; }
  .status.good    .dot { background: var(--good); }
  .status.warning .dot { background: var(--warning); }
  .status.serious .dot { background: var(--serious); }
  .status.critical .dot { background: var(--critical); }

  /* ---- 筛选行 ---- */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters .seg {
    display: inline-flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; overflow: hidden;
  }
  .filters button {
    font: inherit; font-size: 13px; color: var(--ink-2);
    background: transparent; border: 0; padding: 7px 14px; cursor: pointer;
  }
  .filters button.active { background: var(--series-1); color: #fff; }

  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; max-width: 100%; }
  .head-actions .btn, .head-actions .theme-btn { flex: 0 1 auto; }
  #back-btn { display: inline-flex; align-items: center; gap: 5px; }
  #back-btn[hidden] { display: none; }
  @media (max-width: 480px) {
    header.top { align-items: stretch; }
    header.top > div:first-child { min-width: 0; }
    .head-actions { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .head-actions button { min-width: 0; width: 100%; }
    .head-actions #collect-btn { grid-column: 1 / -1; }
  }

  /* ---- 设置弹窗 ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(2px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 8vh 16px 24px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    width: 100%; max-width: 560px; max-height: 82vh; overflow: auto;
  }
  .modal-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 0;
  }
  .modal-hd h2 { font-size: 16px; font-weight: 650; margin: 0; }
  .modal-bd { padding: 12px 20px 20px; }
  .modal-bd h3 {
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    margin: 18px 0 8px;
  }
  .modal-bd h3:first-child { margin-top: 8px; }

  .target-list { display: flex; flex-direction: column; gap: 6px; }
  .target-item {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px;
  }
  .target-item .tl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target-item .tl-id { color: var(--ink-3); font-size: 11px;
    font-variant-numeric: tabular-nums; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; color: var(--ink-2); font-size: 11px; }
  .field input {
    width: 100%; min-width: 0; font: inherit; font-size: 13px; color: var(--ink-1);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px;
  }
  .settings-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .empty-hint { color: var(--ink-3); font-size: 12px; padding: 6px 2px; }

  .picker { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; }
  @media (max-width: 560px) { .picker { grid-template-columns: 1fr 1fr; } }
  .picker select {
    font: inherit; font-size: 13px; color: var(--ink-1);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 8px; min-width: 0;
  }
  .picker select:disabled { opacity: 0.45; }
  .btn {
    font: inherit; font-size: 13px; font-weight: 600;
    color: #fff; background: var(--series-1); border: 0;
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .tag-field { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .tag-field input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink-1);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px;
  }
  @media (max-width: 480px) { .tag-field { align-items: stretch; flex-direction: column; gap: 4px; } }
  .label-hint { margin-top: 8px; font-size: 12px; color: var(--ink-2); min-height: 18px; }

  /* ---- 卡片 ---- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card .card-hd {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 18px 0; gap: 12px; flex-wrap: wrap;
  }
  .card .card-hd h2 { font-size: 15px; font-weight: 650; margin: 0; }
  .card .card-hd .hint { font-size: 12px; color: var(--ink-3); }
  .card .card-bd { padding: 12px 18px 16px; min-width: 0; }
  #detail-card .card-bd { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- 图表(Canvas) ---- */
  .chart-holder { position: relative; }
  .chart-main { height: 320px; width: 100%; }
  .chart-holder.sub { height: 150px; width: 100%; }
  .chart-main, .chart-holder.sub { min-width: 0; }

  /* ---- 表格 ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-weight: 550; color: var(--ink-3);
    font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--grid);
  }
  tbody td {
    padding: 7px 10px; border-bottom: 1px solid var(--grid);
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; }
  .neg { color: var(--critical); font-weight: 600; }
  .empty { color: var(--ink-3); text-align: center; padding: 40px 0; font-size: 13px; }

  /* 刷新时保持帧,不闪跳 */
  #dash.refreshing .kpis,
  #dash.refreshing .chart-holder,
  #dash.refreshing table { opacity: 0.55; transition: opacity 0.15s; }

  /* ---- 多宿舍:每间一张小图 + 房间 KPI 卡 ---- */
  .kpis.rooms { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .kpi.room { border-top: 3px solid var(--accent); }
  .kpi .unit { font-size: 15px; color: var(--ink-2); }

  .mini-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap: 14px;
  }
  .mini-card {
    min-width: 0; overflow: hidden;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--page); padding: 10px 12px 4px;
  }
  .mini-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; min-width: 0; }
  .mini-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .mini-name {
    min-width: 0; flex: 1; font-size: 13px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .mini-val { margin-left: auto; min-width: 0; flex: none; font-size: 12px; color: var(--ink-2);
              font-variant-numeric: tabular-nums; }
  .chart-holder.sub { max-width: 100%; }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    background: var(--ink-1); color: var(--page);
    padding: 9px 16px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 100;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--critical); color: #fff; }

  /* ---- 精致化细节 ---- */
  :focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  button, select, input { font-family: inherit; }
  .theme-btn, .btn, .picker select {
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .kpi { transition: transform .15s ease, box-shadow .15s ease; }
  .kpi:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10); }
  .card { transition: box-shadow .15s ease; }
  tbody tr:hover td { background: rgba(127, 127, 127, 0.06); }
  .room-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
              margin-right: 7px; vertical-align: middle; flex: none; }
  .col-room { white-space: nowrap; }
  .mini-card { transition: border-color .15s ease; cursor: pointer; }
  .mini-card:hover { border-color: var(--axis); }
  .kpi.room { cursor: pointer; }
  #collect-btn {
    --progress: 0%;
    background: linear-gradient(90deg, var(--series-1) var(--progress), var(--surface) var(--progress));
    color: var(--ink-1);
  }
  #collect-btn.busy { color: #fff; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) {
    .kpis:not(.rooms) { grid-template-columns: 1fr; }
    .kpi .value.hero { font-size: clamp(30px, 12vw, 40px); }
    .kpi .value.updated { font-size: 15px !important; line-height: 1.35; overflow-wrap: anywhere; }
    .chart-main { height: 260px; }
    .chart-holder.sub { height: 128px; }
    .picker { grid-template-columns: 1fr; }
  }
  @media (max-width: 360px) {
    .head-actions { grid-template-columns: 1fr; }
    .head-actions #collect-btn { grid-column: auto; }
    .kpis.rooms { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>宿舍电费监控</h1>
      <div class="sub" id="room-sub">—</div>
    </div>
    <div class="head-actions">
      <button class="btn" id="collect-btn" type="button">⚡ 立即采集</button>
      <button class="theme-btn" id="collect-cancel-btn" type="button" hidden>取消采集</button>
      <button class="theme-btn" id="settings-btn" type="button">查询设置</button>
      <button class="theme-btn" id="theme-btn" type="button">深色</button>
    </div>
  </header>

  <div id="dash">
    <!-- 当前状态 -->
    <div class="kpis" id="kpis"></div>

    <!-- 时间筛选 + 返回全览 -->
    <div class="filters" id="filters">
      <button id="back-btn" class="theme-btn" type="button" hidden>← 全部宿舍</button>
      <div class="seg" role="group" aria-label="时间范围">
        <button data-days="7">7 天</button>
        <button data-days="30">30 天</button>
        <button data-days="90">90 天</button>
        <button data-days="0" class="active">全部</button>
      </div>
    </div>

    <!-- 剩余电量曲线 -->
    <div class="card">
      <div class="card-hd">
        <h2>剩余电量曲线</h2>
        <span class="hint" id="chart-hint">—</span>
      </div>
      <div class="card-bd">
        <div class="chart-holder" id="chart-holder"></div>
      </div>
    </div>

    <!-- 读数明细 -->
    <div class="card" id="detail-card" hidden>
      <div class="card-hd">
        <h2>读数明细</h2>
        <span class="hint" id="table-hint">—</span>
      </div>
      <div class="card-bd" id="table-wrap"></div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 管理密钥输入：仅保存到当前标签页的 sessionStorage -->
<div class="modal-overlay" id="admin-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-title" style="max-width:420px">
    <div class="modal-hd"><h2 id="admin-title">管理鉴权</h2></div>
    <div class="modal-bd">
      <label class="field">管理密钥
        <input id="admin-key-input" type="password" autocomplete="new-password" maxlength="256" spellcheck="false">
      </label>
      <div class="label-hint">密钥只保存在当前浏览器标签页，关闭标签页后失效。</div>
      <div class="settings-actions">
        <button id="admin-cancel" class="theme-btn" type="button">取消</button>
        <button id="admin-submit" class="btn" type="button">验证</button>
      </div>
    </div>
  </div>
</div>

<!-- 查询设置弹窗 -->
<div class="modal-overlay" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-hd">
      <h2 id="settings-title">查询设置</h2>
      <button class="theme-btn" id="modal-close" type="button">✕</button>
    </div>
    <div class="modal-bd">
      <h3>已监控宿舍</h3>
      <div id="target-list" class="target-list"></div>

      <h3>添加宿舍(电费)</h3>
      <div class="picker">
        <select id="pick-campus"><option value="">— 选择校区 —</option></select>
        <select id="pick-building" disabled><option value="">— 选择楼栋 —</option></select>
        <select id="pick-room" disabled><option value="">— 选择房间 —</option></select>
        <button id="pick-add" class="btn" disabled>添加</button>
      </div>
      <label class="tag-field" for="pick-tag">宿舍 tag / 别名
        <input id="pick-tag" type="text" maxlength="40" placeholder="例如：我的宿舍">
      </label>
      <div class="label-hint" id="pick-preview"></div>
    </div>
  </div>
</div>

<script src="/static/echarts.min.js"></script>
<script src="/static/app.js" defer></script>
</body>
</html>
