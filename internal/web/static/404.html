<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  /* 与 webapp.html 同一套设计变量,浅/深色主题保持一致 */
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink-1:       #0b0b0b;
    --ink-2:       #52514e;
    --ink-3:       #898781;
    --series-1:    #2a78d6;
    --border:      rgba(11, 11, 11, 0.10);
    --shadow:      0 1px 2px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --ink-1:       #ffffff;
      --ink-2:       #c3c2b7;
      --ink-3:       #898781;
      --series-1:    #3987e5;
      --border:      rgba(255, 255, 255, 0.10);
      --shadow:      0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink-1:       #ffffff;
    --ink-2:       #c3c2b7;
    --ink-3:       #898781;
    --series-1:    #3987e5;
    --border:      rgba(255, 255, 255, 0.10);
    --shadow:      0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px;
    background: var(--page); color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  .page-main { flex: 1; width: 100%; display: grid; place-items: center; }
  .box {
    text-align: center; max-width: 420px; width: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 48px 36px; box-shadow: var(--shadow);
  }
  .site-footer {
    flex: 0 0 auto; color: var(--ink-3); font-size: 12px; text-align: center;
  }
  .site-footer a { color: var(--ink-2); text-underline-offset: 2px; }
  .site-footer a:hover { color: var(--series-1); }
  .code {
    font-size: 72px; font-weight: 700; line-height: 1;
    color: var(--series-1); font-variant-numeric: tabular-nums;
  }
  h1 { font-size: 18px; font-weight: 650; margin: 20px 0 8px; }
  p { color: var(--ink-2); font-size: 13px; margin: 0 0 26px; }
  a.home {
    display: inline-block; font: inherit; font-size: 13px; font-weight: 600;
    color: #fff; background: var(--series-1); border-radius: 8px;
    padding: 8px 20px; text-decoration: none;
    transition: opacity .15s ease;
  }
  a.home:hover { opacity: 0.9; }
</style>
</head>
<body>
  <main class="page-main">
    <div class="box">
      <div class="code">404</div>
      <h1>页面不存在</h1>
      <p>你访问的地址有误或已失效,请从首页重新进入。</p>
      <a class="home" href="/">← 返回首页</a>
    </div>
  </main>
  <footer class="site-footer">
    项目开源于
    <a href="https://github.com/mico-v/wxxyshall_monitoring" target="_blank" rel="noopener noreferrer">github.com/mico-v/wxxyshall_monitoring</a>
  </footer>
  <script src="/static/theme.js"></script>
</body>
</html>
