<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线 · 宿舍电费监控</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    color-scheme: light;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --primary: oklch(0.67 0.16 58);
    --primary-foreground: oklch(0.99 0.02 95);
    --radius: 0.625rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --border: oklch(1 0 0 / 10%);
      --primary: oklch(0.77 0.16 70);
      --primary-foreground: oklch(0.28 0.07 46);
    }
  }
  :root.dark {
    color-scheme: dark;
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --primary: oklch(0.77 0.16 70);
    --primary-foreground: oklch(0.28 0.07 46);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px; background: var(--background); color: var(--foreground);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .page-main { flex: 1; width: 100%; display: grid; place-items: center; }
  .box {
    text-align: center; max-width: 420px; width: 100%;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 48px 36px; box-shadow: 0 10px 30px rgb(0 0 0 / .08);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted-foreground); font-size: 13px; margin: 0 0 26px; }
  a.home {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--primary-foreground);
    background: var(--primary); border-radius: calc(var(--radius) - 2px);
    padding: 8px 20px; text-decoration: none;
  }
  .site-footer { flex: 0 0 auto; color: var(--muted-foreground); font-size: 12px; text-align: center; }
  .site-footer a { color: var(--muted-foreground); text-underline-offset: 2px; }
  .site-footer a:hover { color: var(--foreground); }
</style>
</head>
<body>
  <main class="page-main">
    <div class="box">
      <div class="icon">📡</div>
      <h1>网络连接已断开</h1>
      <p>当前无法连接到服务器。请检查网络连接，稍后重试。<br>离线期间显示的是上次缓存的电费数据。</p>
      <a class="home" href="/">← 重试连接</a>
    </div>
  </main>
  <footer class="site-footer">
    项目开源于
    <a href="https://github.com/mico-v/wxxyshall_monitoring" target="_blank" rel="noopener noreferrer">github.com/mico-v/wxxyshall_monitoring</a>
  </footer>
</body>
</html>
