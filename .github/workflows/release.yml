# 宿舍电费监控 — GitHub Actions 流水线
#
# 触发: 推送到 main 时编译二进制; 创建 tag 时发布到 Release
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

env:
  GO_VERSION: '1.27'

jobs:
  build:
    name: 编译二进制
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]
        include:
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o dist/elec-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/elec/

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  release:
    name: 发布到 GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: 打包
        run: |
          mkdir -p release
          mv elec-windows-amd64 elec-windows-amd64.exe 2>/dev/null || true
          gzip -c elec-linux-amd64 > release/elec-linux-amd64.gz
          gzip -c elec-linux-arm64 > release/elec-linux-arm64.gz
          gzip -c elec-darwin-amd64 > release/elec-darwin-amd64.gz
          zip release/elec-windows-amd64.zip elec-windows-amd64.exe 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true