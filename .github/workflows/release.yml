# 宿舍电费监控 — GitHub Actions 流水线
#
# 触发: 推送到 main 时编译 Linux/Windows 二进制; 创建 tag 时发布到 Release
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

env:
  GO_VERSION: '1.27'

jobs:
  quality:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 校验 internal/web/dist 已与前端源码同步
        run: git diff --exit-code -- internal/web/dist
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --check internal/web/static/sw.js
      - run: python3 -m py_compile login.py

  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            output: elec-linux-amd64
            ldflags: -s -w
          - name: linux-arm64
            goos: linux
            goarch: arm64
            output: elec-linux-arm64
            ldflags: -s -w
          - name: windows-amd64
            goos: windows
            goarch: amd64
            output: elec-windows-amd64.exe
            ldflags: -s -w -H=windowsgui

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 计算版本号（git 短 hash）
        run: echo "VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false \
            -ldflags="${{ matrix.ldflags }} -X github.com/mico-v/wxxyshall-monitoring/internal/web.Version=$VERSION" \
            -o dist/${{ matrix.output }} ./cmd/elec

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/
          retention-days: 7

  android-build:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: 测试与 Lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: 构建 Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: |
          ./gradlew assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/elec-android-debug.apk
      - name: 解码 Android 签名密钥
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: 构建签名 Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/elec-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 7

  release:
    name: 发布到 GitHub Release
    runs-on: ubuntu-latest
    needs: [build, android-build]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-dist

      - name: 打包
        run: |
          mkdir -p release
          gzip -c elec-linux-amd64 > release/elec-linux-amd64.gz
          gzip -c elec-linux-arm64 > release/elec-linux-arm64.gz
          mkdir -p windows-package/data
          cp elec-windows-amd64.exe windows-package/elec.exe
          cp README.md config.example.json login.py windows-package/
          cp -r docs windows-package/
          cd windows-package
          zip -r ../release/elec-windows-amd64.zip .
          cd ..
          cp android-dist/*.apk release/
          cd release
          sha256sum elec-linux-*.gz elec-windows-amd64.zip *.apk > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
