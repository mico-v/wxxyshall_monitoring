# 宿舍电费监控 — GitHub Actions 流水线
#
# 触发: 推送到 main 分支时构建 Go 二进制 + Docker 镜像
# 创建 Release 时自动发布二进制文件到 Release 页面
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

env:
  GO_VERSION: '1.27'

jobs:
  # 构建 Go 二进制
  build-binaries:
    name: 编译二进制文件
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 下载依赖
        run: go mod download

      - name: 编译二进制
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o dist/monitor-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/monitor/
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o dist/webapp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/webapp/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  # 构建 Docker 镜像
  build-docker:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [build-binaries]
    # 仅在推送到 main 或创建 tag 时构建 Docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # 发布到 GitHub Release（仅 tag 时触发）
  release:
    name: 发布到 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: 打包为 Release 附件
        run: |
          cd dist
          # Linux amd64
          tar czf monitor-linux-amd64.tar.gz monitor-linux-amd64 webapp-linux-amd64
          # Linux arm64
          tar czf monitor-linux-arm64.tar.gz monitor-linux-arm64 webapp-linux-arm64
          # macOS amd64
          tar czf monitor-darwin-amd64.tar.gz monitor-darwin-amd64 webapp-darwin-amd64
          # Windows amd64
          zip monitor-windows-amd64.zip monitor-windows-amd64.exe webapp-windows-amd64.exe

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true