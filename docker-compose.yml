# 上传服务器用示例。本地 docker compose 或 `docker build` 后 run:
#   docker compose up -d --build
# 数据在 ./data 目录(config.json / token.json / electricity.db),备份即拷贝该目录。
# ADMIN_KEY 用于 /api/token 上传接口。不设置(或为占位 change-me)时
# entrypoint 会自动生成一个并打印到容器日志,持久化在 ./data/.admin_key,见 README。
services:
  elec-monitor:
    build: .
    image: elec-monitor:latest
    container_name: elec-monitor
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_KEY=${ADMIN_KEY:-change-me}
      - USTS_DATA_DIR=/app/data
    restart: unless-stopped
